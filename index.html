<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtue Snake Game</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #1e1e2e, #24273a, #1a1b2e, #2a2140);
      background-size: 400% 400%;
      animation: bgShift 14s ease infinite;
      color: #cdd6f4;
      font-family: Arial, Helvetica, sans-serif;
    }
    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 {
      margin: 0 0 10px;
      background: linear-gradient(90deg, #89b4fa, #cba6f7, #f5c2e7, #89b4fa);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(203, 166, 247, 0.5));
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      to { background-position: 200% center; }
    }
    #info {
      display: flex;
      gap: 40px;
      font-size: 18px;
      margin-bottom: 10px;
    }
    #info b { color: #a6e3a1; }
    .pop {
      display: inline-block;
      animation: pop 0.3s ease-out;
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.35); color: #f9e2af; }
      100% { transform: scale(1); }
    }
    canvas {
      background: #11111b;
      border: 3px solid #89b4fa;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(137, 180, 250, 0.35), 0 0 60px rgba(203, 166, 247, 0.15);
    }
    #help {
      margin-top: 12px;
      font-size: 14px;
      animation: breathe 2.5s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      from { opacity: 0.4; }
      to   { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <h1>Virtue Snake Game</h1>
  <div id="info">
    <span>Score: <b id="score">0</b></span>
    <span>High Score: <b id="high">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="help">Arrow keys / WASD to move · Space to pause · Enter to restart</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');

    const GRID = 20;               // cells per row/column
    const CELL = canvas.width / GRID;
    const TICK_MS = 100;           // game speed

    let snake, dir, nextDir, food, score, gameOver, paused, timer;
    let highScore = Number(localStorage.getItem('snakeHighScore') || 0);
    highEl.textContent = highScore;

    // Visual effect state
    let particles = [];   // burst particles when eating food
    let floaters = [];    // "+10" text rising from eaten food
    let shake = 0;        // screen shake strength on game over
    let flash = 0;        // red flash strength on game over

    function randomFood() {
      while (true) {
        const f = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
      }
    }

    function reset() {
      const mid = Math.floor(GRID / 2);
      snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = randomFood();
      score = 0;
      gameOver = false;
      paused = false;
      particles = [];
      floaters = [];
      shake = 0;
      flash = 0;
      scoreEl.textContent = score;
      clearInterval(timer);
      timer = setInterval(update, TICK_MS);
    }

    function burst(px, py, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x: px, y: py,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color
        });
      }
    }

    function popScore() {
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth; // restart the CSS animation
      scoreEl.classList.add('pop');
    }

    function update() {
      if (gameOver || paused) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) {
        return endGame();
      }
      // Self collision (tail moves away this tick, so it is allowed to follow it)
      if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) {
        return endGame();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        popScore();

        const px = food.x * CELL + CELL / 2;
        const py = food.y * CELL + CELL / 2;
        burst(px, py, '#f38ba8');
        floaters.push({ x: px, y: py, life: 1, text: '+10' });

        food = randomFood();
      } else {
        snake.pop();
      }
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      shake = 12;
      flash = 1;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highEl.textContent = highScore;
      }
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(137, 180, 250, 0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < GRID; i++) {
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
      }
      ctx.stroke();
    }

    function drawFood(now) {
      const pulse = Math.sin(now * 0.008) * 1.5;
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      ctx.save();
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#f38ba8';
      ctx.fillStyle = '#f38ba8';
      ctx.beginPath();
      ctx.arc(cx, cy, CELL / 2 - 3 + pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSnake() {
      const r = 5;
      // Draw tail first so the head sits on top
      for (let i = snake.length - 1; i >= 0; i--) {
        const s = snake[i];
        const hue = 140 + Math.min(i * 2, 60);
        const light = Math.max(45, 65 - i * 0.8);
        const color = `hsl(${hue}, 70%, ${light}%)`;

        ctx.save();
        ctx.shadowBlur = i === 0 ? 14 : 8;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, r);
        ctx.fill();
        ctx.restore();
      }

      // Eyes on the head, facing the direction of movement
      const head = snake[0];
      const cx = head.x * CELL + CELL / 2;
      const cy = head.y * CELL + CELL / 2;
      const fwdX = cx + dir.x * 4;
      const fwdY = cy + dir.y * 4;
      const perpX = -dir.y * 4;
      const perpY = dir.x * 4;
      [1, -1].forEach(side => {
        const ex = fwdX + perpX * side;
        const ey = fwdY + perpY * side;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#11111b';
        ctx.beginPath();
        ctx.arc(ex + dir.x * 1, ey + dir.y * 1, 1.2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5 * p.life + 0.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawFloaters() {
      floaters.forEach(f => {
        ctx.globalAlpha = Math.max(f.life, 0);
        ctx.fillStyle = '#f9e2af';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
      });
      ctx.globalAlpha = 1;
    }

    function drawOverlay() {
      if (!gameOver && !paused) return;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#cdd6f4';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#cba6f7';
      if (gameOver) {
        ctx.font = 'bold 30px Arial';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
        ctx.shadowBlur = 0;
        ctx.font = '16px Arial';
        ctx.fillText('Press Enter to play again', canvas.width / 2, canvas.height / 2 + 20);
      } else {
        ctx.font = 'bold 30px Arial';
        ctx.fillText('Paused', canvas.width / 2, canvas.height / 2);
      }
      ctx.shadowBlur = 0;
    }

    function render(now) {
      ctx.save();

      // Screen shake
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
      }

      ctx.fillStyle = '#11111b';
      ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
      drawGrid();
      drawFood(now);
      drawSnake();

      // Particles and floating text
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.life -= 0.03;
      });
      drawParticles();

      floaters = floaters.filter(f => f.life > 0);
      floaters.forEach(f => {
        f.y -= 0.7;
        f.life -= 0.02;
      });
      drawFloaters();

      // Red flash on game over
      if (flash > 0) {
        ctx.fillStyle = `rgba(243, 139, 168, ${flash * 0.35})`;
        ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
        flash *= 0.9;
        if (flash < 0.01) flash = 0;
      }

      ctx.restore();
      drawOverlay();

      requestAnimationFrame(render);
    }

    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();

      if (key === 'enter') {
        if (gameOver) reset();
        return;
      }
      if (key === ' ') {
        e.preventDefault();
        if (!gameOver) paused = !paused;
        return;
      }

      const moves = {
        arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
      };
      const m = moves[key];
      if (!m) return;
      e.preventDefault();

      // Prevent reversing directly into the body
      if (m.x === -dir.x && m.y === -dir.y) return;
      nextDir = m;
    });

    reset();
    requestAnimationFrame(render);
  </script>
</body>
</html>
