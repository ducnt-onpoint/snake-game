<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 { margin: 0 0 10px; }
    #info {
      display: flex;
      gap: 40px;
      font-size: 18px;
      margin-bottom: 10px;
    }
    canvas {
      background: #11111b;
      border: 3px solid #89b4fa;
      border-radius: 6px;
    }
    #help { margin-top: 12px; opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div id="info">
    <span>Score: <b id="score">0</b></span>
    <span>High Score: <b id="high">0</b></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="help">Arrow keys / WASD to move · Space to pause · Enter to restart</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');

    const GRID = 20;               // cells per row/column
    const CELL = canvas.width / GRID;
    const TICK_MS = 100;           // game speed

    let snake, dir, nextDir, food, score, gameOver, paused, timer;
    let highScore = Number(localStorage.getItem('snakeHighScore') || 0);
    highEl.textContent = highScore;

    function randomFood() {
      while (true) {
        const f = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
      }
    }

    function reset() {
      const mid = Math.floor(GRID / 2);
      snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = randomFood();
      score = 0;
      gameOver = false;
      paused = false;
      scoreEl.textContent = score;
      clearInterval(timer);
      timer = setInterval(update, TICK_MS);
      draw();
    }

    function update() {
      if (gameOver || paused) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) {
        return endGame();
      }
      // Self collision (tail moves away this tick, so it is allowed to follow it)
      if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) {
        return endGame();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        food = randomFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highEl.textContent = highScore;
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#11111b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Food
      ctx.fillStyle = '#f38ba8';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#a6e3a1' : '#94e2d5';
        ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
      });

      // Overlays
      if (gameOver || paused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#cdd6f4';
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px Arial';
        if (gameOver) {
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '16px Arial';
          ctx.fillText('Press Enter to play again', canvas.width / 2, canvas.height / 2 + 20);
        } else {
          ctx.fillText('Paused', canvas.width / 2, canvas.height / 2);
        }
      }
    }

    document.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();

      if (key === 'enter') {
        if (gameOver) reset();
        return;
      }
      if (key === ' ') {
        e.preventDefault();
        if (!gameOver) {
          paused = !paused;
          draw();
        }
        return;
      }

      const moves = {
        arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
      };
      const m = moves[key];
      if (!m) return;
      e.preventDefault();

      // Prevent reversing directly into the body
      if (m.x === -dir.x && m.y === -dir.y) return;
      nextDir = m;
    });

    reset();
  </script>
</body>
</html>
